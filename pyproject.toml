[project]
name = "rdr2-ss"
version = "0.1.0"
description = "CLI tool to convert Red Dead Redemption 2 PRDR photo files into standard JPG images by stripping the 300-byte Rockstar header."
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = []

[project.scripts]
rdr2-ss = "rdr2_ss.cli:main"

[tool.poetry]
packages = [{ include = "rdr2_ss", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
